<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password — Risk Assessment</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/style.css" />
  <style>
    #setup-screen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:24px; }
    .auth-page-header { display:flex; align-items:center; gap:10px; margin-bottom:28px; }
    .auth-page-logo { width:34px; height:34px; background:linear-gradient(135deg,#f97316,#fbbf24); border-radius:8px; display:flex; align-items:center; justify-content:center; color:#000; flex-shrink:0; }
    .auth-page-title { font-size:17px; font-weight:700; color:#f1f5f9; }
    .auth-page-footer { text-align:center; font-size:12px; color:#78716c; margin-top:18px; }
    .auth-page-footer a { color:#f97316; text-decoration:none; font-weight:600; }
  </style>
</head>
<body>
  <div id="setup-screen">
    <div class="form-panel" style="max-width:420px;width:100%;border-radius:20px;border:1px solid rgba(251,146,60,0.18);margin:24px;justify-content:flex-start;">

      <div class="auth-page-header">
        <div class="auth-page-logo">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          </svg>
        </div>
        <span class="auth-page-title">Set a new password</span>
      </div>

      <div id="reset-error" class="error-msg" style="display:none"></div>
      <div id="reset-success" class="success-msg" style="display:none"></div>

      <form id="reset-form" style="display:none">
        <div class="form-group">
          <label class="field-label" for="new-password">New Password</label>
          <input type="password" id="new-password" placeholder="••••••••" required autocomplete="new-password" />
        </div>
        <div class="form-group">
          <label class="field-label" for="new-confirm">Confirm New Password</label>
          <input type="password" id="new-confirm" placeholder="••••••••" required autocomplete="new-password" />
        </div>
        <button type="submit" id="reset-btn" class="btn-primary">
          <span class="btn-inner">
            Update Password
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M5 12h14M12 5l7 7-7 7"/>
            </svg>
          </span>
        </button>
      </form>

      <div class="auth-page-footer"><a href="/">Back to home</a></div>
    </div>
  </div>

  <script>
    // Supabase puts the recovery tokens (or an error) in the URL fragment.
    const params       = new URLSearchParams(window.location.hash.slice(1));
    const accessToken  = params.get("access_token");
    const refreshToken = params.get("refresh_token");
    const linkError    = params.get("error_description");

    const errorEl   = document.getElementById("reset-error");
    const successEl = document.getElementById("reset-success");
    const form      = document.getElementById("reset-form");

    function showError(msg) { errorEl.textContent = msg; errorEl.style.display = "block"; }

    // Keep the tokens out of the address bar and browser history.
    history.replaceState(null, "", window.location.pathname);

    if (linkError) {
      showError(linkError.replace(/\+/g, " ") + " Please request a new reset link from the Sign In screen.");
    } else if (!accessToken || params.get("type") !== "recovery") {
      showError("This page needs a valid reset link. Use \"Forgot password?\" on the Sign In screen to get one.");
    } else {
      form.style.display = "block";
      document.getElementById("new-password").focus();
    }

    form.addEventListener("submit", async e => {
      e.preventDefault();
      errorEl.style.display = "none";
      const btn = document.getElementById("reset-btn");
      btn.disabled = true;

      try {
        const res = await fetch("/api/auth/reset-password", {
          method:  "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            access_token:  accessToken,
            refresh_token: refreshToken,
            password: document.getElementById("new-password").value,
            confirm:  document.getElementById("new-confirm").value
          })
        });
        const data = await res.json();
        if (data.success) {
          form.style.display = "none";
          successEl.textContent = "Password updated — you're signed in. Taking you back…";
          successEl.style.display = "block";
          setTimeout(() => { window.location.href = "/"; }, 2000);
        } else {
          showError(data.error || "Couldn't update your password.");
          btn.disabled = false;
        }
      } catch {
        showError("Network error — please try again.");
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
